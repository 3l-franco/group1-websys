name: Expand EnrollEase deployment bundle

on:
  push:
    branches:
      - deployment/neon-render
    paths:
      - ".bootstrap/READY"

permissions:
  contents: write

jobs:
  expand-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v4
        with:
          ref: deployment/neon-render
          persist-credentials: true

      - name: Expand source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-*.b64 > /tmp/enrollease.zip.b64
          base64 --decode /tmp/enrollease.zip.b64 > /tmp/enrollease.zip
          mkdir -p /tmp/enrollease-src
          unzip -q /tmp/enrollease.zip -d /tmp/enrollease-src
          test -f /tmp/enrollease-src/EnrollEaseJava/Dockerfile
          cp -a /tmp/enrollease-src/EnrollEaseJava/. ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-expand.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add EnrollEase source and cloud deployment configuration"
          git push origin deployment/neon-render
