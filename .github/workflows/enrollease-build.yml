name: EnrollEase Java build
on:
  pull_request:
    branches: [deployment/neon-render]
    paths:
      - 'EnrollEaseJava/**'
      - '.github/workflows/enrollease-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile and package
        run: mvn -B -f EnrollEaseJava/pom.xml clean package
